# Repo-local tool configuration ONLY. This product declares NO package: per
# conventions/no-internal-packages.md, a package means a separate repo with a valid PyPI
# project, consumed as a dependency. The data-pipeline/ folder is scripts, invoked by path.
# CoreLog Vision, the offline engine package (ADR-0057, instantiated from the product-repo archetype).
# The EXAMPLE engine is numpy-only on purpose (an instantly-installable, no-hang reference); a real product pins
# its research-chosen SOTA engines in data-pipeline/requirements.txt and documents them in docs/frameworks/.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# allow short index names (i, j, ix, iy) in the patch/grid loops, intentional domain notation.
ignore = ["E741"]
